<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B0B14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15182A"/>
      <stop offset="100%" stop-color="#101322"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F5FA"/>
      <stop offset="100%" stop-color="#A0A3B8"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <rect width="400" height="400" fill="url(#bgGlow)"/>

  <!-- Outer Ring Frame with Glow -->
  <circle cx="200" cy="200" r="170" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="200" cy="200" r="156" fill="url(#bodyGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Subtle grid pattern inside -->
  <circle cx="200" cy="200" r="130" stroke="rgba(108,99,255,0.15)" stroke-width="1"/>
  <circle cx="200" cy="200" r="100" stroke="rgba(56,189,248,0.15)" stroke-width="1"/>

  <!-- Developer Monogram & Silhouette -->
  <!-- Stylized Monogram {AT} -->
  <text x="200" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="78" font-weight="800" text-anchor="middle" fill="url(#ringGrad)" letter-spacing="-2">
    {AT}
  </text>
  <text x="200" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="url(#textGrad)" letter-spacing="4">
    ABU TAHIR SK
  </text>
  <text x="200" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#38BDF8" letter-spacing="2">
    FULL-STACK DEVELOPER
  </text>

  <!-- Corner tech accents -->
  <circle cx="70" cy="70" r="3" fill="#6C63FF" opacity="0.7"/>
  <circle cx="330" cy="70" r="3" fill="#38BDF8" opacity="0.7"/>
  <circle cx="70" cy="330" r="3" fill="#38BDF8" opacity="0.7"/>
  <circle cx="330" cy="330" r="3" fill="#6C63FF" opacity="0.7"/>
</svg>
